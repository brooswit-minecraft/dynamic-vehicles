name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Test release scripts
        run: python3 -m unittest discover -s scripts

      - name: Check the mod does not require a newer NeoForge than the pack runs
        run: python3 scripts/check_neoforge_floor.py

      - name: Build and test
        run: ./gradlew build --no-daemon

      # Gradle reports BUILD SUCCESSFUL even when the GameTest server fails to start (e.g. a
      # required mod missing from the runtime classpath), so a green exit code proves nothing.
      # Fail closed: the server must not have failed to start, and every required @GameTest whose
      # effective template namespace is selected by build.gradle's default gameTestNamespaces
      # must be reported as passed. Dedicated aliases outside that default selection are retained,
      # but must not inflate this normal-server expectation.
      - name: Run GameTests
        run: |
          set -o pipefail
          ./gradlew runGameTestServer --no-daemon 2>&1 | tee gametest.log
          python3 scripts/check_gametest_count.py gametest.log

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: dynamic-vehicles
          path: build/libs/*.jar
          if-no-files-found: error

  release-gate:
    uses: brooswit-factory/release-gate/.github/workflows/gate.yml@v1
    with:
      gated-paths: '["^src/"]'
      version-file: 'gradle.properties'

  # MINECRAFT-489 diagnostic preparation ONLY (comment 51964): not wired to any trigger change,
  # not part of the required build job, and not to be pushed/published without a separate
  # execution decision. Bounded to a hard 3-run ceiling and a hard per-job timeout, so it cannot
  # become an unbounded "rerun until green" loop. Tests one narrow question against the two
  # already-recorded runs (42140562220 passed, 42142250830 failed, both with this var unset):
  # does forcing Rapier's embedded Rayon pool to a single worker change this one test's own
  # per-20-tick trace, under the SAME shared, full-suite, ~50-concurrent-island conditions as
  # those two runs (see MINECRAFT-489 comment 51963 on why isolating away from that batch would
  # test a different, narrower question instead). Does not touch the `build` job, its default
  # gameTestNamespaces selection, or scripts/check_gametest_count.py's required-count check.
  rayon-thread-diagnostic:
    if: false  # MINECRAFT-489: never runs until a separate execution decision flips this.
    runs-on: ubuntu-latest
    timeout-minutes: 25  # hard per-job ceiling: ~4 min/run * 3 runs + setup, not open-ended.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # MINECRAFT-489: 3 repeats, hard-stopped by the loop bound below, each its own log file so
      # none are overwritten. RAYON_NUM_THREADS is rayon-core's own documented startup variable
      # (read once at global pool creation, per the pinned rayon-core 1.13.0 source cited in
      # comment 51962); Sable's own runtime path has no overriding pool-builder call, so this
      # should reach it with zero source changes IF Gradle's forked test-worker JVM inherits this
      # step's shell environment (the project default for Gradle JavaExec-family tasks, but not
      # independently verified against this repo's exact NeoGradle wiring).
      #
      # What the printed RAYON_NUM_THREADS line below actually establishes: that the variable was
      # present in THIS shell, for THIS run. It does NOT establish that the forked JVM inherited
      # it, that Sable's native pool-creation call observed it, or what the resulting pool size
      # actually was — this repo has no hook into Sable's own thread-pool state to confirm that,
      # short of native-side instrumentation this diagnostic does not add.
      - name: Run GameTests x3 with RAYON_NUM_THREADS=1
        env:
          RAYON_NUM_THREADS: "1"
        run: |
          set -o pipefail
          for i in 1 2 3; do
            echo "=== MINECRAFT-489 diagnostic run ${i}/3, RAYON_NUM_THREADS=${RAYON_NUM_THREADS} ===" | tee "gametest-rayon1-run${i}.log"
            ./gradlew runGameTestServer --no-daemon 2>&1 | tee -a "gametest-rayon1-run${i}.log"
          done

      - name: Preserve MINECRAFT-489 diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-489-rayon-diagnostic
          path: gametest-rayon1-run*.log
          if-no-files-found: error

  client-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Install virtual display and software GL
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth imagemagick libgl1-mesa-dri libopenal1
      - name: Compile test-only client harness
        run: ./gradlew classes -PclientAcceptance --no-daemon -Dorg.gradle.jvmargs=-Xmx1G
      - name: Run disposable local server and real client
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          ALSOFT_DRIVERS: 'null'
        run: xvfb-run -a -s '-screen 0 1280x720x24' python3 tools/client-smoke/acceptance.py
      - name: Preserve client acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-acceptance
          path: |
            client-acceptance-*.log
            client-acceptance-*.png
            run-acceptance-client/client-acceptance-*.json
            run-acceptance-client/client-acceptance-failure.txt
            run-acceptance-client/logs/latest.log
            run-acceptance-client/crash-reports/
            run-acceptance-client/screenshots/client-acceptance-hud-*.png
            run-acceptance-server/logs/latest.log
          if-no-files-found: warn
