# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# You can find the latest versions here: https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# Environment Properties
# You can find the latest versions here: https://projects.neoforged.net/neoforged/neoforge
# The Minecraft version must agree with the Neo version to get a valid artifact
minecraft_version=1.21.1
# The Minecraft version range can use any release version of Minecraft as bounds.
minecraft_version_range=[1.21.1]
# The Neo version must agree with the Minecraft version to get a valid artifact
neo_version=21.1.250
# The loader version range can only use the major version of FML as bounds
loader_version_range=[1,)

## Mod Properties

# The unique mod identifier for the mod. Must be lowercase in English locale. Must fit the regex [a-z][a-z0-9_]{1,63}
# Must match the String constant located in the main mod class annotated with @Mod.
mod_id=dynamicvehicles
# The human-readable display name for the mod.
mod_name=Dynamic Vehicles
# The license of the mod. Review your options at https://choosealicense.com/.
mod_license=MIT
# The group ID for the mod. Matches the base package used for the mod sources,
# mirroring dynamic-atmosphere's io.github.brooswitminecraft group convention.
mod_group_id=io.github.brooswitminecraft

# Shipped version. Read by the release gate; never edited by hand in a PR
# (the release workflow assigns it from changelog.d fragments).
version=0.0.0

# The terrain API this mod builds against. The jar is fetched from that mod's
# GitHub release and verified against its sha512 (see build.gradle).
terrain_version=0.21.0
terrain_sha512=b488a994f098f30201b58942e10c3588d6337cdaaf58e47635d6da50a7ad1671abdf22915d2ef16a078419a9beb1155c570373cdab7a4d7da51585fdb28f4761

# Sable physics (compile-only; the pack supplies it at runtime). PolyForm Shield 1.0.0 licensed.
sable_version=2.0.5
sable_url=https://cdn.modrinth.com/data/T9PomCSv/versions/U678xqle/sable-neoforge-1.21.1-2.0.5.jar
sable_sha512=bf3d8c87bcc5efb99afffd50305fc978086ed48a63e106816e3a8a3901f8052f4480ea527dbd7d4003f7775ed4d020529098034f4e307aefac9cc42df2b4c19a

# Dynamic Atmosphere (compile-only; the pack supplies it at runtime). Its public DynamicAtmosphereMod.emitMaterial
# is how the cars emit exhaust and dust. Pinned to the pack's version.
atmosphere_version=0.20.2-alpha.1
atmosphere_url=https://cdn.modrinth.com/data/PZV7RorC/versions/rbhr3g1K/dynamicatmosphere-0.20.2-alpha.1.jar
atmosphere_sha512=3dca74bd24480a65ddc06af6d686993ceea6d61d16541b9587f09330091ed5a8aa62e7f5984e07172970a07a280994f6f550c55fdcabf3b70981b746a894f362
