name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Test release scripts
        run: python3 -m unittest discover -s scripts

      - name: Check the mod does not require a newer NeoForge than the pack runs
        run: python3 scripts/check_neoforge_floor.py

      - name: Build and test
        run: ./gradlew build --no-daemon

      # Gradle reports BUILD SUCCESSFUL even when the GameTest server fails to start (e.g. a
      # required mod missing from the runtime classpath), so a green exit code proves nothing.
      # Fail closed: the server must not have failed to start, and every @GameTest in the source
      # must be reported as a passed required test.
      - name: Run GameTests
        run: |
          set -o pipefail
          ./gradlew runGameTestServer --no-daemon 2>&1 | tee gametest.log
          if grep -q 'Failed to start the minecraft server' gametest.log; then
            echo "::error::GameTest server failed to start; no production GameTest executed"
            exit 1
          fi
          expected=$(grep -rhE '^\s*@GameTest\(' src/main | wc -l)
          passed=$(sed -n 's/.*All \([0-9][0-9]*\) required tests passed.*/\1/p' gametest.log | tail -n1)
          if [ -z "$passed" ] || [ "$expected" -eq 0 ] || [ "$passed" != "$expected" ]; then
            echo "::error::expected $expected GameTests to pass, log reports '${passed:-none}'"
            exit 1
          fi

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: dynamic-vehicles
          path: build/libs/*.jar
          if-no-files-found: error

  release-gate:
    uses: brooswit-factory/release-gate/.github/workflows/gate.yml@v1
    with:
      gated-paths: '["^src/"]'
      version-file: 'gradle.properties'

  client-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Install virtual display and software GL
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth imagemagick libgl1-mesa-dri libopenal1
      - name: Compile test-only client harness
        run: ./gradlew classes -PclientAcceptance --no-daemon -Dorg.gradle.jvmargs=-Xmx1G
      - name: Run disposable local server and real client
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          ALSOFT_DRIVERS: 'null'
        run: xvfb-run -a -s '-screen 0 1280x720x24' python3 tools/client-smoke/acceptance.py
      - name: Preserve client acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-acceptance
          path: |
            client-acceptance-*.log
            client-acceptance-*.png
            run-acceptance-client/client-acceptance-*.json
            run-acceptance-client/client-acceptance-failure.txt
            run-acceptance-client/logs/latest.log
            run-acceptance-client/crash-reports/
            run-acceptance-server/logs/latest.log
          if-no-files-found: warn
