name: Release

# On every push to main, release if changelog.d gained a fragment since the
# last tag. The version is the last tag bumped by the highest `bump:` level
# among those fragments (see changelog.d/README.md); nothing is committed
# back to main. The GitHub release jar is the shipped artifact: Modrinth gets
# that exact jar, never a rebuild. Run manually to (re)publish the latest
# tagged release to Modrinth, e.g. after the project was first created.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dynamic-vehicles-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last_tag=$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n1)
          if [ -n "$last_tag" ]; then
            last="${last_tag#v}"
            fragments=$(git diff --name-only --diff-filter=A "$last_tag" HEAD -- changelog.d | grep -v '/README.md$' | grep '\.md$' || true)
          else
            last="0.0.0"
            fragments=$(git ls-files changelog.d | grep -v '/README.md$' | grep '\.md$' || true)
          fi
          if [ -n "$fragments" ]; then
            # shellcheck disable=SC2086
            python3 scripts/next_version.py "$last" $fragments > release-info.txt
            echo "version=$(head -n1 release-info.txt)" >> "$GITHUB_OUTPUT"
            echo "new=true" >> "$GITHUB_OUTPUT"
            tail -n +2 release-info.txt > release-notes.md
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "$last_tag" ]; then
            echo "version=$last" >> "$GITHUB_OUTPUT"
            echo "new=false" >> "$GITHUB_OUTPUT"
            gh release view "$last_tag" --json body --jq .body > release-notes.md
          else
            echo "No new changelog fragments since ${last_tag:-the start}; nothing to release."
          fi

      - name: Set up JDK 21
        if: steps.version.outputs.new == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build and test
        if: steps.version.outputs.new == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./gradlew build --no-daemon "-Pmod_version=$VERSION"

      - name: Publish GitHub release
        if: steps.version.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" "build/libs/dynamicvehicles-$VERSION.jar" \
            --target "$GITHUB_SHA" --title "dynamic-vehicles $VERSION" --notes-file release-notes.md

      # Modrinth publishes the exact jar attached to the GitHub release.
      - name: Fetch release jar
        if: steps.version.outputs.version
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p build/libs
          gh release download "v$VERSION" --pattern "dynamicvehicles-$VERSION.jar" --dir build/libs --clobber

      - uses: oven-sh/setup-bun@v2
        if: steps.version.outputs.version

      - name: Check existing Modrinth version
        id: modrinth
        if: steps.version.outputs.version
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          test -n "$MODRINTH_TOKEN"
          test -n "$PROJECT_ID"
          python3 scripts/check-modrinth-version.py >> "$GITHUB_OUTPUT"

      - name: Publish Modrinth version
        if: steps.version.outputs.version && steps.modrinth.outputs.exists != 'true'
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          bunx --bun github:brooswit-minecraft/rinth#v0.10.0 publish "$PROJECT_ID" \
            --file "build/libs/dynamicvehicles-$VERSION.jar" \
            --version "$VERSION" --changelog-file release-notes.md \
            --game-version 1.21.1 --loader neoforge --channel alpha

      - name: Sync Modrinth environment
        if: steps.version.outputs.version
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
          VERSION: ${{ steps.version.outputs.version }}
        run: python3 scripts/sync-modrinth-settings.py

      # Draft projects are invisible to unauthenticated readers, so print what a
      # packwiz pin needs (version id, file URL, hashes) for the job summary.
      - name: Record Modrinth version
        if: steps.version.outputs.version
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          PROJECT_ID: ${{ vars.MODRINTH_PROJECT_ID }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          curl -fsS -H "Authorization: $MODRINTH_TOKEN" -H "User-Agent: brooswit-minecraft/dynamic-vehicles-release" \
            "https://api.modrinth.com/v2/project/$PROJECT_ID/version" \
            | jq --arg v "$VERSION" '[.[] | select(.version_number == $v)] | .[0] | {id, project_id, version_number, status, file: .files[0] | {filename, url, hashes}}' \
            | tee modrinth-version.json
          { echo "### Modrinth version"; echo '```json'; cat modrinth-version.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
